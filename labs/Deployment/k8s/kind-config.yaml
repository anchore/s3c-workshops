kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: anchore
nodes:
- role: control-plane
- role: worker
  extraPortMappings:
    - containerPort: 30228
      hostPort: 8228
      listenAddress: 127.0.0.1
      protocol: TCP
    - containerPort: 30300
      hostPort: 3000
      listenAddress: 127.0.0.1
      protocol: TCP
